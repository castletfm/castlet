{{define "content"}}
{{$ch := .Data.Channel}}
<section class="admin-head">
  <h1>New episode — {{$ch.Title}}</h1>
</section>

{{with .Data.Error}}<p class="error">{{.}}</p>{{end}}

<!-- Multipart upload: the CSRF token rides in the query string, not a hidden
     field, because the server reads it without parsing the (large, streamed)
     multipart body. See server/csrf.go requestCSRFToken. -->
<form method="post" action="/admin/channels/{{$ch.ID}}/episodes?csrf_token={{$.CSRFToken}}" enctype="multipart/form-data" class="stack">
  <label>Title
    <input type="text" name="title" value="{{.Data.Title}}" required autofocus>
  </label>
  <label>Description
    <textarea name="description" rows="4">{{.Data.Description}}</textarea>
  </label>
  <label>Spoken language <span class="muted">(for transcription accuracy and punctuation)</span>
    {{$lang := .Data.Language}}
    <select name="language">
      <option value=""{{if eq $lang ""}} selected{{end}}>Auto-detect</option>
      {{range languageOptions}}
      <option value="{{.Code}}"{{if eq .Code $lang}} selected{{end}}>{{.Name}}</option>
      {{end}}
    </select>
  </label>
  <label>Media file <span class="muted">(audio or video)</span>
    <input type="file" name="media" accept="audio/*,video/*" required>
  </label>
  <div class="form-actions">
    <button type="submit">Upload episode</button>
    <a class="btn ghost" href="/admin/channels/{{$ch.ID}}/episodes">Cancel</a>
  </div>
  <p class="muted">The episode is created as a draft. Transcription is queued automatically.</p>
</form>
{{end}}
