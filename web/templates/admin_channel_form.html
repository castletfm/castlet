{{define "content"}}
{{$ch := .Data.Channel}}
<section class="admin-head">
  <h1>{{if $ch.ID}}Edit channel{{else}}New channel{{end}}</h1>
</section>

{{with .Data.Error}}<p class="error">{{.}}</p>{{end}}

<form method="post" action="{{.Data.Action}}" class="stack">
  <label>Title
    <input type="text" name="title" value="{{$ch.Title}}" required autofocus>
  </label>
  <label>Description
    <textarea name="description" rows="4">{{$ch.Description}}</textarea>
  </label>
  <label>Primary language <span class="muted">(applies to the whole feed; each episode is transcribed in its own detected language)</span>
    {{$cur := or $ch.Language "en"}}
    <select name="language">
      {{range languageOptions}}
      <option value="{{.Code}}"{{if eq .Code $cur}} selected{{end}}>{{.Name}}</option>
      {{end}}
    </select>
  </label>
  <div class="form-actions">
    <button type="submit">Save</button>
    <a class="btn ghost" href="/admin/">Cancel</a>
  </div>
</form>
{{end}}
