name: 'Close stale issues and PRs'

on:
  schedule:
    - cron: '30 1 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          stale-issue-message: 'This issue is stale because it has been open 14 days with no activity. Remove the stale label or comment, or it will be closed in 7 days.'
          stale-pr-message: 'This PR is stale because it has been open 14 days with no activity. Remove the stale label or comment, or it will be closed in 14 days.'
          close-issue-message: 'This issue was closed because it has been stalled for 7 days with no activity. This does not mean it is rejected — it is just hidden from the maintainers'' view for now. Feel free to reopen with new comments.'
          close-pr-message: 'This PR was closed because it has been stalled for 14 days with no activity. This does not mean it is rejected — feel free to reopen with new comments or changes.'
          days-before-issue-stale: 14
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 14
          exempt-issue-labels: long-term
          exempt-pr-labels: long-term
